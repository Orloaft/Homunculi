<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated; /* Chrome/Safari */
            image-rendering: -moz-crisp-edges; /* Firefox */
            image-rendering: crisp-edges; /* Standard */
        }
        
        /* Fix for Chrome/WebGL flickering */
        canvas {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
            transform: translateZ(0); /* Force GPU acceleration */
            backface-visibility: hidden; /* Prevent flickering */
            will-change: transform; /* Optimize for animations */
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Pre-loader styles for instant display during Electron startup */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #11130d;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        
        #preloader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Cartridge image container and animation */
        .cartridge-container {
            width: 300px;
            height: 300px;
            perspective: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .cartridge-image {
            width: 375px; /* Scaled up by 50% from 250px */
            height: auto;
            animation: cartridgeSpin 8s linear infinite;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5));
        }
        
        @keyframes cartridgeSpin {
            0% {
                transform: rotateY(0deg) rotateX(0deg) scale(1);
            }
            25% {
                transform: rotateY(90deg) rotateX(5deg) scale(0.95);
            }
            50% {
                transform: rotateY(180deg) rotateX(0deg) scale(1);
            }
            75% {
                transform: rotateY(270deg) rotateX(-5deg) scale(0.95);
            }
            100% {
                transform: rotateY(360deg) rotateX(0deg) scale(1);
            }
        }
        
        /* Glow pulse effect */
        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.8));
            }
        }
        
        .cartridge-image:hover {
            animation: cartridgeSpin 2s linear infinite, glow 2s ease-in-out infinite;
        }
        
        .loading-text {
            position: absolute;
            bottom: 30%;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            opacity: 0.7;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <!-- Pre-loader shown immediately while Electron/Phaser loads -->
    <div id="preloader">
        <div class="cartridge-container" id="cartridge-3d-container">
            <!-- 3D cartridge will be rendered here -->
            <img src="gamecartridge/Box+Cartridge-export.png" alt="Loading..." class="cartridge-image" id="cartridge-fallback" />
        </div>
        <div class="loading-text">Initializing...</div>
    </div>
    
    <div id="game-container"></div>
    
    <script src="scripts/phaser.min.js"></script>
    <script src="scripts/hitbox-config.js?v=8"></script>
    <script src="scripts/electron-fixes.js"></script>
    <script src="scripts/ChunkManager.js"></script>
    <script src="scripts/SpatialHashGrid.js"></script>
    <script src="scripts/LODSystem.js"></script>
    <script src="scripts/ObstacleManager.js"></script>
    <script src="scripts/InfiniteGameScene.js"></script>
    <script src="scripts/boss-contract.js?v=1"></script>

    <!-- Save and Achievement Systems -->
    <script src="src/systems/SaveManager.js"></script>
    <script src="build/systems/AchievementManager.js"></script>
    <script src="src/scenes/SaveSlotScene.js"></script>
    <script src="src/ui/AchievementNotification.js"></script>

    <!-- Verify all classes loaded correctly -->
    <script>
        console.log('=== Verifying System Classes ===');
        console.log('SaveManager:', typeof SaveManager !== 'undefined' ? '✅ Loaded' : '❌ Missing');
        console.log('AchievementManager:', typeof AchievementManager !== 'undefined' ? '✅ Loaded' : '❌ Missing');
        console.log('SaveSlotScene:', typeof SaveSlotScene !== 'undefined' ? '✅ Loaded' : '❌ Missing');
        console.log('AchievementNotification:', typeof AchievementNotification !== 'undefined' ? '✅ Loaded' : '❌ Missing');
        console.log('================================');

        // If AchievementManager is missing, provide detailed error
        if (typeof AchievementManager === 'undefined') {
            console.error('❌ CRITICAL: AchievementManager is not defined!');
            console.error('This will cause errors when trying to create new games or load saves.');
            console.error('Check the browser console for loading errors of build/systems/AchievementManager.js');
        }
    </script>

    <script src="scripts/game.js?v=210"></script>
    <script src="scripts/autoplay.js"></script>
    
    <script>
        // Hide the pre-loader once Phaser starts rendering
        window.hidePreloader = function() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.classList.add('hidden');
                // Remove from DOM after transition
                setTimeout(() => {
                    preloader.remove();
                }, 500);
            }
        };
        
        // Also hide it after a maximum timeout in case something goes wrong
        setTimeout(window.hidePreloader, 15000);
        
        // Handle WebGL errors gracefully
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('WebGL')) {
                console.warn('WebGL Error detected, game should fallback to Canvas');
                // Update loading text to show Canvas mode
                const loadingText = document.querySelector('.loading-text');
                if (loadingText) {
                    loadingText.textContent = 'Initializing (Canvas Mode)...';
                }
            }
        });
    </script>
</body>
</html>
