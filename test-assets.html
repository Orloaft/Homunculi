<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Loading Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        .status {
            padding: 5px 10px;
            margin: 5px 0;
            border-radius: 3px;
        }
        .success {
            background: #2a4a2a;
            color: #4f4;
        }
        .error {
            background: #4a2a2a;
            color: #f44;
        }
        h2 {
            color: #4af;
        }
    </style>
</head>
<body>
    <h1>Asset Loading Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        let successCount = 0;
        let errorCount = 0;
        
        // Test critical assets
        const assetsToTest = [
            // Images
            { type: 'image', path: 'assets/images/art1.png', name: 'Loading Background' },
            { type: 'image', path: 'assets/images/magustitle.png', name: 'Title Screen' },
            { type: 'image', path: 'assets/images/gameover.png', name: 'Game Over Screen' },
            { type: 'image', path: 'assets/images/grass.PNG', name: 'Grass Tile' },
            { type: 'image', path: 'assets/images/stone.png', name: 'Stone Tile' },
            
            // Sprites
            { type: 'image', path: 'assets/sprites/wizmove/newiz/wizard_idle.PNG', name: 'Wizard Idle' },
            { type: 'image', path: 'assets/sprites/homunculicharacters/orbidle10framesdims640x64.png', name: 'Orb Character' },
            
            // Enemies
            { type: 'image', path: 'assets/enemies/forestlandfoes/giantflywalk4frames.png', name: 'Giant Fly' },
            { type: 'image', path: 'assets/enemies/mushroom/Run.png', name: 'Mushroom Enemy' },
            
            // UI
            { type: 'image', path: 'assets/ui/planets/forestland.png', name: 'Forest Planet' },
            { type: 'image', path: 'assets/ui/stagetitles/forestlandtitle.png', name: 'Forest Title' },
            
            // Effects
            { type: 'image', path: 'assets/effects/orbs/fireorb.png', name: 'Fire Orb' },
            { type: 'image', path: 'assets/effects/spells/fire1.png', name: 'Fire Spell' },
            
            // Audio
            { type: 'audio', path: 'assets/audio/bgm2.mp3', name: 'Background Music' },
            { type: 'audio', path: 'assets/audio/homonculibgm.mp3', name: 'Homunculi BGM' }
        ];
        
        function addResult(name, success, error = null) {
            const div = document.createElement('div');
            div.className = `status ${success ? 'success' : 'error'}`;
            div.textContent = `${success ? '✓' : '✗'} ${name}${error ? ': ' + error : ''}`;
            results.appendChild(div);
            
            if (success) successCount++;
            else errorCount++;
        }
        
        async function testAsset(asset) {
            return new Promise((resolve) => {
                if (asset.type === 'image') {
                    const img = new Image();
                    img.onload = () => {
                        addResult(asset.name, true);
                        resolve();
                    };
                    img.onerror = () => {
                        addResult(asset.name, false, asset.path);
                        resolve();
                    };
                    img.src = asset.path;
                } else if (asset.type === 'audio') {
                    const audio = new Audio();
                    audio.oncanplaythrough = () => {
                        addResult(asset.name, true);
                        resolve();
                    };
                    audio.onerror = () => {
                        addResult(asset.name, false, asset.path);
                        resolve();
                    };
                    audio.src = asset.path;
                }
            });
        }
        
        async function runTests() {
            results.innerHTML = '<h2>Testing Asset Loading...</h2>';
            
            for (const asset of assetsToTest) {
                await testAsset(asset);
            }
            
            const summary = document.createElement('div');
            summary.innerHTML = `
                <h2>Summary</h2>
                <div class="status success">✓ Successful: ${successCount}</div>
                <div class="status error">✗ Failed: ${errorCount}</div>
                <div style="margin-top: 20px;">
                    ${errorCount === 0 ? 
                        '<p style="color: #4f4;">🎉 All assets loaded successfully!</p>' : 
                        '<p style="color: #f44;">⚠️ Some assets failed to load. Check the paths above.</p>'}
                </div>
            `;
            results.appendChild(summary);
        }
        
        runTests();
    </script>
</body>
</html>
