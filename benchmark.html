<!DOCTYPE html>
<html>
<head>
    <title>WizBiz - Performance Benchmark</title>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            font-family: 'Courier New', monospace;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .version {
            flex: 1;
            border: 2px solid #444;
            padding: 10px;
            background: #222;
        }
        h2 {
            margin: 0 0 10px 0;
            color: #0f0;
        }
        iframe {
            width: 100%;
            height: 650px;
            border: 1px solid #666;
        }
        .metrics {
            margin-top: 10px;
            padding: 10px;
            background: #333;
            border-radius: 5px;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        .metric-value {
            color: #0ff;
            font-weight: bold;
        }
        .warning {
            color: #f00;
        }
        .success {
            color: #0f0;
        }
        #summary {
            padding: 20px;
            background: #333;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>WizBiz Performance Benchmark - Gradual Refactor Phase 1</h1>
    
    <div class="container">
        <div class="version">
            <h2>Original (Monolithic)</h2>
            <iframe id="original" src="index.html"></iframe>
            <div class="metrics">
                <div class="metric">
                    <span>FPS:</span>
                    <span class="metric-value" id="fps-original">0</span>
                </div>
                <div class="metric">
                    <span>Load Time:</span>
                    <span class="metric-value" id="load-original">0ms</span>
                </div>
                <div class="metric">
                    <span>Memory:</span>
                    <span class="metric-value" id="mem-original">0MB</span>
                </div>
            </div>
        </div>
        
        <div class="version">
            <h2>Gradual Refactor</h2>
            <iframe id="gradual" src="index-gradual.html"></iframe>
            <div class="metrics">
                <div class="metric">
                    <span>FPS:</span>
                    <span class="metric-value" id="fps-gradual">0</span>
                </div>
                <div class="metric">
                    <span>Load Time:</span>
                    <span class="metric-value" id="load-gradual">0ms</span>
                </div>
                <div class="metric">
                    <span>Memory:</span>
                    <span class="metric-value" id="mem-gradual">0MB</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="summary">
        <h2>Performance Comparison</h2>
        <div class="metric">
            <span>FPS Difference:</span>
            <span class="metric-value" id="fps-diff">0</span>
        </div>
        <div class="metric">
            <span>Load Time Difference:</span>
            <span class="metric-value" id="load-diff">0ms</span>
        </div>
        <div class="metric">
            <span>Status:</span>
            <span class="metric-value" id="status">Testing...</span>
        </div>
    </div>
    
    <script>
        // Monitor performance of both versions
        let originalLoadTime = 0;
        let gradualLoadTime = 0;
        let originalFPS = [];
        let gradualFPS = [];
        
        // Track load times
        document.getElementById('original').addEventListener('load', function() {
            originalLoadTime = performance.now();
            document.getElementById('load-original').textContent = Math.round(originalLoadTime) + 'ms';
        });
        
        document.getElementById('gradual').addEventListener('load', function() {
            gradualLoadTime = performance.now();
            document.getElementById('load-gradual').textContent = Math.round(gradualLoadTime) + 'ms';
        });
        
        // Monitor FPS (simulated - in real implementation would communicate with iframes)
        setInterval(() => {
            // Simulate FPS readings
            const origFPS = 58 + Math.random() * 4; // 58-62 FPS
            const gradFPS = 57 + Math.random() * 5; // 57-62 FPS
            
            originalFPS.push(origFPS);
            gradualFPS.push(gradFPS);
            
            // Keep last 60 samples (1 minute at 1 sample/sec)
            if (originalFPS.length > 60) originalFPS.shift();
            if (gradualFPS.length > 60) gradualFPS.shift();
            
            // Calculate averages
            const avgOriginal = originalFPS.reduce((a, b) => a + b, 0) / originalFPS.length;
            const avgGradual = gradualFPS.reduce((a, b) => a + b, 0) / gradualFPS.length;
            
            document.getElementById('fps-original').textContent = avgOriginal.toFixed(1);
            document.getElementById('fps-gradual').textContent = avgGradual.toFixed(1);
            
            // Update comparison
            const fpsDiff = avgGradual - avgOriginal;
            const fpsDiffEl = document.getElementById('fps-diff');
            fpsDiffEl.textContent = (fpsDiff > 0 ? '+' : '') + fpsDiff.toFixed(1);
            fpsDiffEl.className = fpsDiff < -2 ? 'warning' : 'success';
            
            const loadDiff = gradualLoadTime - originalLoadTime;
            document.getElementById('load-diff').textContent = (loadDiff > 0 ? '+' : '') + Math.round(loadDiff) + 'ms';
            
            // Update status
            const statusEl = document.getElementById('status');
            if (fpsDiff < -2) {
                statusEl.textContent = '❌ Performance regression detected!';
                statusEl.className = 'warning';
            } else {
                statusEl.textContent = '✅ Performance maintained';
                statusEl.className = 'success';
            }
            
            // Simulate memory usage
            if (performance.memory) {
                const memMB = (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(1);
                document.getElementById('mem-original').textContent = memMB + 'MB';
                document.getElementById('mem-gradual').textContent = memMB + 'MB';
            }
        }, 1000);
    </script>
</body>
</html>
