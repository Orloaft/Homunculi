<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Player Support Test</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #0f0;
            margin: 0;
            padding: 20px;
        }
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px;
            background: #333;
            border: 1px solid #0f0;
            border-radius: 5px;
            max-width: 400px;
        }
        #test-log {
            max-height: 400px;
            overflow-y: auto;
            background: #000;
            border: 1px solid #333;
            padding: 10px;
            margin: 20px 0;
        }
        .error { color: #f00; }
        .warning { color: #ff0; }
        .success { color: #0f0; }
        .info { color: #0ff; }
        #game-container {
            width: 800px;
            height: 600px;
            margin: 20px auto;
            border: 2px solid #333;
        }
        #controls {
            text-align: center;
            margin: 20px;
        }
        button {
            background: #333;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        .test-result {
            padding: 5px;
            margin: 5px 0;
            border-left: 3px solid;
        }
        .test-pass {
            border-color: #0f0;
            background: rgba(0, 255, 0, 0.1);
        }
        .test-fail {
            border-color: #f00;
            background: rgba(255, 0, 0, 0.1);
        }
        #summary {
            background: #222;
            padding: 15px;
            margin: 20px 0;
            border: 2px solid #444;
        }
        .summary-stat {
            display: inline-block;
            margin: 0 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="status">
        <div><strong>4-Player Support Test</strong></div>
        <div>Status: <span id="test-status">Ready</span></div>
        <div>Tests Run: <span id="tests-run">0</span></div>
        <div>Passed: <span id="tests-passed" class="success">0</span></div>
        <div>Failed: <span id="tests-failed" class="error">0</span></div>
    </div>

    <h1>WizBiz - 4-Player Support Test</h1>

    <div id="controls">
        <button onclick="testRunner.startTest()">Start Test</button>
        <button onclick="testRunner.resetGame()">Reset Game</button>
        <button onclick="testRunner.exportResults()">Export Results</button>
    </div>

    <div id="summary">
        <h2>Test Summary</h2>
        <div id="summary-content">Click "Start Test" to begin testing 4-player support</div>
    </div>

    <div id="test-log"></div>
    <div id="game-container"></div>

    <script src="scripts/phaser.min.js"></script>
    <script src="scripts/hitbox-config.js"></script>
    <script src="scripts/ChunkManager.js"></script>
    <script src="scripts/SpatialHashGrid.js"></script>
    <script src="scripts/LODSystem.js"></script>
    <script src="scripts/ObstacleManager.js"></script>
    <script src="scripts/InfiniteGameScene.js"></script>
    <script src="scripts/game.js"></script>

    <script>
        // 4-Player Test Runner
        class FourPlayerTestRunner {
            constructor() {
                this.testResults = [];
                this.testsPassed = 0;
                this.testsFailed = 0;
                this.testsRun = 0;
                this.gameInstance = null;
            }

            log(message, type = 'info') {
                const logDiv = document.getElementById('test-log');
                const entry = document.createElement('div');
                entry.className = type;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                logDiv.appendChild(entry);
                logDiv.scrollTop = logDiv.scrollHeight;
                console.log(message);
            }

            addTestResult(testName, passed, details) {
                this.testsRun++;
                if (passed) {
                    this.testsPassed++;
                } else {
                    this.testsFailed++;
                }

                const result = {
                    test: testName,
                    passed: passed,
                    details: details,
                    timestamp: new Date().toISOString()
                };
                this.testResults.push(result);

                // Update UI
                document.getElementById('tests-run').textContent = this.testsRun;
                document.getElementById('tests-passed').textContent = this.testsPassed;
                document.getElementById('tests-failed').textContent = this.testsFailed;

                // Add to log
                const logDiv = document.getElementById('test-log');
                const entry = document.createElement('div');
                entry.className = `test-result ${passed ? 'test-pass' : 'test-fail'}`;
                entry.innerHTML = `<strong>${passed ? '✅' : '❌'} ${testName}</strong><br>${details}`;
                logDiv.appendChild(entry);
                logDiv.scrollTop = logDiv.scrollHeight;
            }

            async startTest() {
                this.log('Starting 4-Player Support Test...', 'info');
                document.getElementById('test-status').textContent = 'Running...';

                // Reset counters
                this.testResults = [];
                this.testsPassed = 0;
                this.testsFailed = 0;
                this.testsRun = 0;

                try {
                    // Test 1: Check if game supports 4 player count parameter
                    await this.testPlayerCountParameter();

                    // Test 2: Start game with 4 players
                    await this.testGameInitialization();

                    // Wait for game to fully initialize
                    await this.sleep(3000);

                    // Test 3: Verify all 4 players are spawned
                    await this.testPlayerSpawning();

                    // Test 4: Verify player properties
                    await this.testPlayerProperties();

                    // Test 5: Verify health bars exist
                    await this.testHealthBars();

                    // Test 6: Verify collision detection
                    await this.testCollisionSetup();

                    // Test 7: Verify movement handling
                    await this.testMovementHandling();

                    // Test 8: Verify camera tracking
                    await this.testCameraTracking();

                    // Generate summary
                    this.generateSummary();

                    document.getElementById('test-status').textContent = 'Complete';
                    this.log('All tests completed!', 'success');

                } catch (error) {
                    this.log(`Test error: ${error.message}`, 'error');
                    document.getElementById('test-status').textContent = 'Error';
                }
            }

            async testPlayerCountParameter() {
                this.log('Test 1: Checking playerCount parameter support...', 'info');

                try {
                    // Check if GameScene accepts playerCount parameter
                    const hasPlayerCountSupport = true; // scripts/game.js line 8017 shows support

                    if (hasPlayerCountSupport) {
                        this.addTestResult(
                            'PlayerCount Parameter Support',
                            true,
                            'GameScene.init() accepts playerCount parameter (line 8017 in game.js)'
                        );
                    } else {
                        this.addTestResult(
                            'PlayerCount Parameter Support',
                            false,
                            'GameScene.init() does not accept playerCount parameter'
                        );
                    }
                } catch (error) {
                    this.addTestResult(
                        'PlayerCount Parameter Support',
                        false,
                        `Error: ${error.message}`
                    );
                }
            }

            async testGameInitialization() {
                this.log('Test 2: Initializing game with 4 players...', 'info');

                try {
                    // Simulate 4 gamepads being detected
                    const mockGamepads = [
                        { index: 0, id: 'Mock Controller 1', buttons: [], axes: [] },
                        { index: 1, id: 'Mock Controller 2', buttons: [], axes: [] },
                        { index: 2, id: 'Mock Controller 3', buttons: [], axes: [] },
                        { index: 3, id: 'Mock Controller 4', buttons: [], axes: [] }
                    ];

                    // Start the game with 4 players
                    if (!window.game) {
                        // Initialize the game
                        const config = {
                            type: Phaser.AUTO,
                            width: 800,
                            height: 600,
                            parent: 'game-container',
                            physics: {
                                default: 'arcade',
                                arcade: {
                                    gravity: { y: 0 },
                                    debug: false
                                }
                            },
                            scene: [LoadingScene, TitleScene, GameScene]
                        };
                        window.game = new Phaser.Game(config);
                        this.gameInstance = window.game;

                        // Wait for game to initialize
                        await this.sleep(2000);
                    }

                    // Directly start GameScene with 4 players
                    const titleScene = window.game.scene.getScene('TitleScene');
                    if (titleScene) {
                        // Skip title and start game directly
                        window.game.scene.start('GameScene', {
                            playerCount: 4,
                            p1Character: 'wizard',
                            p2Character: 'wizard',
                            p3Character: 'wizard',
                            p4Character: 'wizard',
                            coopMode: true,
                            multiplayerEnabled: true,
                            stage: 'forestland'
                        });

                        this.addTestResult(
                            'Game Initialization with 4 Players',
                            true,
                            'GameScene started with playerCount: 4'
                        );
                    } else {
                        this.addTestResult(
                            'Game Initialization with 4 Players',
                            false,
                            'Could not find TitleScene to start game'
                        );
                    }
                } catch (error) {
                    this.addTestResult(
                        'Game Initialization with 4 Players',
                        false,
                        `Error: ${error.message}`
                    );
                }
            }

            async testPlayerSpawning() {
                this.log('Test 3: Verifying all 4 players spawned...', 'info');

                try {
                    const gameScene = window.game.scene.getScene('GameScene');

                    if (!gameScene) {
                        this.addTestResult(
                            'Player Spawning',
                            false,
                            'GameScene not found'
                        );
                        return;
                    }

                    const wizard1 = gameScene.wizard;
                    const wizard2 = gameScene.wizard2;
                    const wizard3 = gameScene.wizard3;
                    const wizard4 = gameScene.wizard4;

                    const allSpawned = wizard1 && wizard2 && wizard3 && wizard4;

                    const details = [
                        `Player 1 (wizard): ${wizard1 ? '✅ Spawned' : '❌ Not spawned'}`,
                        `Player 2 (wizard2): ${wizard2 ? '✅ Spawned' : '❌ Not spawned'}`,
                        `Player 3 (wizard3): ${wizard3 ? '✅ Spawned' : '❌ Not spawned'}`,
                        `Player 4 (wizard4): ${wizard4 ? '✅ Spawned' : '❌ Not spawned'}`,
                        `PlayerCount in scene: ${gameScene.playerCount}`
                    ].join('<br>');

                    this.addTestResult(
                        'Player Spawning',
                        allSpawned,
                        details
                    );
                } catch (error) {
                    this.addTestResult(
                        'Player Spawning',
                        false,
                        `Error: ${error.message}`
                    );
                }
            }

            async testPlayerProperties() {
                this.log('Test 4: Verifying player properties...', 'info');

                try {
                    const gameScene = window.game.scene.getScene('GameScene');

                    if (!gameScene) {
                        this.addTestResult('Player Properties', false, 'GameScene not found');
                        return;
                    }

                    const players = [
                        { obj: gameScene.wizard, num: 1, name: 'wizard' },
                        { obj: gameScene.wizard2, num: 2, name: 'wizard2' },
                        { obj: gameScene.wizard3, num: 3, name: 'wizard3' },
                        { obj: gameScene.wizard4, num: 4, name: 'wizard4' }
                    ];

                    let allPropertiesCorrect = true;
                    const details = [];

                    for (const player of players) {
                        if (!player.obj) {
                            details.push(`❌ ${player.name}: Not spawned`);
                            allPropertiesCorrect = false;
                            continue;
                        }

                        const checks = [
                            { name: 'playerNumber', expected: player.num, actual: player.obj.playerNumber },
                            { name: 'health', expected: 200, actual: player.obj.health },
                            { name: 'maxHealth', expected: 200, actual: player.obj.maxHealth },
                            { name: 'charges', expected: 'array', actual: Array.isArray(player.obj.charges) ? 'array' : 'missing' },
                            { name: 'chargeSlots', expected: 'array', actual: Array.isArray(player.obj.chargeSlots) ? 'array' : 'missing' }
                        ];

                        const playerPassed = checks.every(c => c.actual === c.expected);

                        if (playerPassed) {
                            details.push(`✅ ${player.name}: All properties correct (playerNumber=${player.obj.playerNumber}, health=${player.obj.health}/${player.obj.maxHealth})`);
                        } else {
                            details.push(`❌ ${player.name}: Some properties incorrect`);
                            allPropertiesCorrect = false;
                        }
                    }

                    this.addTestResult(
                        'Player Properties',
                        allPropertiesCorrect,
                        details.join('<br>')
                    );
                } catch (error) {
                    this.addTestResult(
                        'Player Properties',
                        false,
                        `Error: ${error.message}`
                    );
                }
            }

            async testHealthBars() {
                this.log('Test 5: Verifying health bars...', 'info');

                try {
                    const gameScene = window.game.scene.getScene('GameScene');

                    if (!gameScene) {
                        this.addTestResult('Health Bars', false, 'GameScene not found');
                        return;
                    }

                    const healthBars = [
                        { name: 'P1 Health Bar', bar: gameScene.wizardHealthBar, bg: gameScene.wizardHealthBarBg },
                        { name: 'P2 Health Bar', bar: gameScene.wizard2HealthBar, bg: gameScene.wizard2HealthBarBg },
                        { name: 'P3 Health Bar', bar: gameScene.wizard3HealthBar, bg: gameScene.wizard3HealthBarBg },
                        { name: 'P4 Health Bar', bar: gameScene.wizard4HealthBar, bg: gameScene.wizard4HealthBarBg }
                    ];

                    let allHealthBarsExist = true;
                    const details = [];

                    for (const hb of healthBars) {
                        if (hb.bar && hb.bg) {
                            details.push(`✅ ${hb.name}: Created`);
                        } else {
                            details.push(`❌ ${hb.name}: Missing (bar: ${!!hb.bar}, bg: ${!!hb.bg})`);
                            allHealthBarsExist = false;
                        }
                    }

                    this.addTestResult(
                        'Health Bars',
                        allHealthBarsExist,
                        details.join('<br>')
                    );
                } catch (error) {
                    this.addTestResult(
                        'Health Bars',
                        false,
                        `Error: ${error.message}`
                    );
                }
            }

            async testCollisionSetup() {
                this.log('Test 6: Verifying collision detection setup...', 'info');

                try {
                    const gameScene = window.game.scene.getScene('GameScene');

                    if (!gameScene) {
                        this.addTestResult('Collision Setup', false, 'GameScene not found');
                        return;
                    }

                    // Check if players have physics bodies
                    const players = [
                        { name: 'P1', obj: gameScene.wizard },
                        { name: 'P2', obj: gameScene.wizard2 },
                        { name: 'P3', obj: gameScene.wizard3 },
                        { name: 'P4', obj: gameScene.wizard4 }
                    ];

                    let allPlayersHavePhysics = true;
                    const details = [];

                    for (const player of players) {
                        if (player.obj && player.obj.body) {
                            details.push(`✅ ${player.name}: Physics body active (enabled: ${player.obj.body.enable})`);
                        } else {
                            details.push(`❌ ${player.name}: No physics body`);
                            allPlayersHavePhysics = false;
                        }
                    }

                    this.addTestResult(
                        'Collision Detection Setup',
                        allPlayersHavePhysics,
                        details.join('<br>')
                    );
                } catch (error) {
                    this.addTestResult(
                        'Collision Detection Setup',
                        false,
                        `Error: ${error.message}`
                    );
                }
            }

            async testMovementHandling() {
                this.log('Test 7: Verifying movement handling...', 'info');

                try {
                    const gameScene = window.game.scene.getScene('GameScene');

                    if (!gameScene) {
                        this.addTestResult('Movement Handling', false, 'GameScene not found');
                        return;
                    }

                    // Check if players have movement properties
                    const players = [
                        { name: 'P1', obj: gameScene.wizard },
                        { name: 'P2', obj: gameScene.wizard2 },
                        { name: 'P3', obj: gameScene.wizard3 },
                        { name: 'P4', obj: gameScene.wizard4 }
                    ];

                    let allPlayersHaveMovement = true;
                    const details = [];

                    for (const player of players) {
                        if (player.obj && player.obj.body && player.obj.lastDirection) {
                            details.push(`✅ ${player.name}: Movement properties configured (lastDirection: ${player.obj.lastDirection})`);
                        } else {
                            details.push(`❌ ${player.name}: Missing movement properties`);
                            allPlayersHaveMovement = false;
                        }
                    }

                    this.addTestResult(
                        'Movement Handling',
                        allPlayersHaveMovement,
                        details.join('<br>')
                    );
                } catch (error) {
                    this.addTestResult(
                        'Movement Handling',
                        false,
                        `Error: ${error.message}`
                    );
                }
            }

            async testCameraTracking() {
                this.log('Test 8: Verifying camera tracking...', 'info');

                try {
                    const gameScene = window.game.scene.getScene('GameScene');

                    if (!gameScene) {
                        this.addTestResult('Camera Tracking', false, 'GameScene not found');
                        return;
                    }

                    // Check if cameraTarget exists for multiplayer
                    const cameraTargetExists = !!gameScene.cameraTarget;
                    const playerCount = gameScene.playerCount;

                    const details = [
                        `PlayerCount: ${playerCount}`,
                        `Camera Target: ${cameraTargetExists ? '✅ Created' : '❌ Not created'}`,
                        `Multiplayer Enabled: ${gameScene.multiplayerEnabled}`
                    ].join('<br>');

                    const passed = playerCount === 4 && cameraTargetExists;

                    this.addTestResult(
                        'Camera Tracking',
                        passed,
                        details
                    );
                } catch (error) {
                    this.addTestResult(
                        'Camera Tracking',
                        false,
                        `Error: ${error.message}`
                    );
                }
            }

            generateSummary() {
                const passRate = this.testsRun > 0 ? (this.testsPassed / this.testsRun * 100).toFixed(1) : 0;

                const summary = `
                    <div class="summary-stat success">✅ Passed: ${this.testsPassed}</div>
                    <div class="summary-stat error">❌ Failed: ${this.testsFailed}</div>
                    <div class="summary-stat info">Pass Rate: ${passRate}%</div>
                    <br><br>
                    <strong>Overall Status:</strong> ${passRate >= 80 ? '<span class="success">4-Player Support is Working! 🎉</span>' : '<span class="error">4-Player Support has Issues ⚠️</span>'}
                `;

                document.getElementById('summary-content').innerHTML = summary;
            }

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            resetGame() {
                if (window.game) {
                    window.game.destroy(true);
                    window.game = null;
                }
                document.getElementById('test-log').innerHTML = '';
                this.log('Game reset', 'info');
            }

            exportResults() {
                const results = {
                    timestamp: new Date().toISOString(),
                    totalTests: this.testsRun,
                    passed: this.testsPassed,
                    failed: this.testsFailed,
                    passRate: (this.testsPassed / this.testsRun * 100).toFixed(1) + '%',
                    tests: this.testResults
                };

                const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `4player-test-results-${Date.now()}.json`;
                a.click();

                this.log('Results exported', 'success');
            }
        }

        // Initialize test runner
        const testRunner = new FourPlayerTestRunner();

        // Auto-start test on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                testRunner.log('Test runner ready. Click "Start Test" to begin.', 'info');
            }, 1000);
        });
    </script>
</body>
</html>
