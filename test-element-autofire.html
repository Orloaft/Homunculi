<!DOCTYPE html>
<html>
<head>
    <title>Element Autofire Test</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #222;
            color: white;
            font-family: monospace;
        }
        #debug {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            font-size: 12px;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div id="debug">
        <h3>Debug Info</h3>
        <div id="debugContent"></div>
    </div>
    <script>
        class TestScene extends Phaser.Scene {
            create() {
                // Debug display
                this.debugText = document.getElementById('debugContent');
                
                // Initialize systems
                this.chargeSlots = new Array(8).fill(null);
                this.charges = [];
                this.maxCharges = 4;
                this.spellCooldowns = new Map();
                this.globalSpellCooldown = 0;
                
                // Element config
                this.elementConfig = {
                    fire: { fireRate: 1000, color: 0xff0000 },
                    water: { fireRate: 1500, color: 0x0099ff },
                    lightning: { fireRate: 800, color: 0xffff00 },
                    earth: { fireRate: 2000, color: 0x8b4513 }
                };
                
                // Test: Add some elements to slots
                this.chargeSlots[0] = 'fire';
                this.chargeSlots[1] = 'water';
                this.chargeSlots[2] = 'lightning';
                
                // Rebuild charges array
                this.updateCharges();
                
                // Track firing
                this.fireLog = [];
                
                console.log('Initial state:', {
                    chargeSlots: this.chargeSlots,
                    charges: this.charges
                });
            }
            
            update(time, delta) {
                let debugInfo = '<b>ChargeSlots:</b><br>';
                for (let i = 0; i < 4; i++) {
                    debugInfo += `Slot ${i}: ${this.chargeSlots[i] || 'empty'}<br>`;
                }
                
                debugInfo += '<br><b>Charges Array:</b><br>';
                debugInfo += JSON.stringify(this.charges) + '<br>';
                
                debugInfo += '<br><b>Autofire Check:</b><br>';
                
                // Check autofire logic
                if (this.chargeSlots && this.chargeSlots.length > 0) {
                    for (let slotIndex = 0; slotIndex < 4; slotIndex++) {
                        const element = this.chargeSlots[slotIndex];
                        if (element) {
                            const elementConfig = this.elementConfig[element];
                            const fireRate = elementConfig.fireRate || 1000;
                            
                            if (this.canCastSpell(element, slotIndex)) {
                                // Calculate charge index
                                let chargeIndex = 0;
                                for (let i = 0; i < slotIndex && i < this.chargeSlots.length; i++) {
                                    if (this.chargeSlots[i] !== null) {
                                        chargeIndex++;
                                    }
                                }
                                
                                debugInfo += `Slot ${slotIndex} (${element}) - ChargeIndex: ${chargeIndex} - FIRING!<br>`;
                                
                                this.fireLog.push({
                                    time: time,
                                    slotIndex: slotIndex,
                                    chargeIndex: chargeIndex,
                                    element: element
                                });
                                
                                this.setSpellCooldown(element, fireRate, slotIndex);
                            } else {
                                const cooldown = this.spellCooldowns.get(`${element}_${slotIndex}`) || 0;
                                const remaining = Math.max(0, cooldown - time);
                                debugInfo += `Slot ${slotIndex} (${element}) - Cooldown: ${Math.round(remaining)}ms<br>`;
                            }
                        }
                    }
                }
                
                debugInfo += '<br><b>Recent Fires:</b><br>';
                const recentFires = this.fireLog.slice(-5);
                recentFires.forEach(log => {
                    debugInfo += `T:${Math.round(log.time)} - Slot${log.slotIndex}(${log.element}) as Charge${log.chargeIndex}<br>`;
                });
                
                this.debugText.innerHTML = debugInfo;
            }
            
            updateCharges() {
                this.charges = [];
                for (let i = 0; i < 4 && i < this.chargeSlots.length; i++) {
                    if (this.chargeSlots[i] !== null) {
                        this.charges.push(this.chargeSlots[i]);
                    }
                }
            }
            
            canCastSpell(spellType, chargeIndex = null) {
                const now = this.time.now;
                
                if (now < this.globalSpellCooldown) {
                    return false;
                }
                
                const cooldownKey = chargeIndex !== null ? `${spellType}_${chargeIndex}` : spellType;
                const spellCooldown = this.spellCooldowns.get(cooldownKey) || 0;
                
                return now >= spellCooldown;
            }
            
            setSpellCooldown(spellType, cooldownMs, chargeIndex = null) {
                const now = this.time.now;
                const cooldownKey = chargeIndex !== null ? `${spellType}_${chargeIndex}` : spellType;
                this.spellCooldowns.set(cooldownKey, now + cooldownMs);
                this.globalSpellCooldown = now + 100;
            }
        }
        
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            scene: TestScene
        };
        
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
