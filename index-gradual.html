<!DOCTYPE html>
<html>
<head>
    <title>WizBiz - Gradual Refactor</title>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #game-container {
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #fps-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #0f0;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 3px;
        }
        #info {
            margin-top: 20px;
            color: #fff;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="fps-counter">FPS: 0</div>
    <div id="game-container"></div>
    <div id="info">
        <p>Gradual Refactor Test - Phase 1</p>
        <p>Configuration extracted to src/config/GameConfig.js</p>
    </div>
    
    <script src="phaser.min.js"></script>
    
    <!-- Load extracted configuration -->
    <script src="src/config/GameConfig.js"></script>
    
    <!-- Load game with modifications to use extracted config -->
    <script>
        // FPS monitoring
        let fps = 0;
        let frameCount = 0;
        let lastTime = performance.now();
        
        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            if (currentTime >= lastTime + 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                document.getElementById('fps-counter').textContent = `FPS: ${fps}`;
                frameCount = 0;
                lastTime = currentTime;
            }
            requestAnimationFrame(updateFPS);
        }
        updateFPS();
    </script>
    
    <!-- Load modified game that uses extracted config -->
    <script src="game-gradual-v1.js"></script>
</body>
</html>
