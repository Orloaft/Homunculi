<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Select Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a1a;
            color: #fff;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .planet-test {
            text-align: center;
            padding: 10px;
            background: #1a1a2a;
            border-radius: 8px;
        }
        .planet-test img {
            max-width: 100px;
            max-height: 100px;
            display: block;
            margin: 10px auto;
        }
        .success { color: #4f4; }
        .error { color: #f44; }
        .new { 
            border: 2px solid #44f; 
            background: #112244;
        }
    </style>
</head>
<body>
    <h1>Stage Select Planet Verification</h1>
    <p>This test verifies all 10 planets are loading correctly, especially the 3 new ones.</p>
    
    <div id="results"></div>
    
    <div class="grid" id="planetGrid"></div>

    <script>
        const results = document.getElementById('results');
        const grid = document.getElementById('planetGrid');
        
        const stages = [
            { name: 'Forestland', file: 'forestland.png', isNew: false },
            { name: 'Caveland', file: 'caveland.png', isNew: false },
            { name: 'Desertland', file: 'desertland.png', isNew: false },
            { name: 'Swampland', file: 'swampland.png', isNew: true },
            { name: 'Snowland', file: 'snowland.png', isNew: true },
            { name: 'Oceanland', file: 'oceanland.png', isNew: true },
            { name: 'Lavaland', file: 'lavaland.png', isNew: false },
            { name: 'Graveland', file: 'graveland.png', isNew: false },
            { name: 'Castleland', file: 'castleland.png', isNew: false },
            { name: 'Spireland', file: 'spireland.png', isNew: false }
        ];
        
        let loadedCount = 0;
        let errorCount = 0;
        
        stages.forEach((stage, index) => {
            const div = document.createElement('div');
            div.className = 'planet-test' + (stage.isNew ? ' new' : '');
            
            const title = document.createElement('h3');
            title.textContent = `${index}. ${stage.name}`;
            div.appendChild(title);
            
            const img = document.createElement('img');
            img.src = `assets/ui/planets/${stage.file}`;
            
            const status = document.createElement('div');
            status.textContent = 'Loading...';
            
            img.onload = () => {
                loadedCount++;
                status.className = 'success';
                status.textContent = '✓ Loaded';
                updateSummary();
            };
            
            img.onerror = () => {
                errorCount++;
                status.className = 'error';
                status.textContent = '✗ Failed';
                updateSummary();
            };
            
            div.appendChild(img);
            div.appendChild(status);
            
            if (stage.isNew) {
                const newLabel = document.createElement('div');
                newLabel.style.color = '#44f';
                newLabel.style.fontWeight = 'bold';
                newLabel.textContent = '★ NEW STAGE ★';
                div.appendChild(newLabel);
            }
            
            grid.appendChild(div);
        });
        
        function updateSummary() {
            const total = stages.length;
            const checked = loadedCount + errorCount;
            
            if (checked === total) {
                results.innerHTML = `
                    <h2>Summary:</h2>
                    <div class="success">✓ Successfully loaded: ${loadedCount}/${total}</div>
                    <div class="error">✗ Failed to load: ${errorCount}/${total}</div>
                    ${errorCount === 0 ? 
                        '<h3 style="color: #4f4;">🎉 All planets loaded successfully!</h3>' : 
                        '<h3 style="color: #f44;">⚠️ Some planets failed to load</h3>'}
                    <p>The 3 new planets (Swampland, Snowland, Oceanland) are highlighted in blue.</p>
                `;
            }
        }
    </script>
</body>
</html>
