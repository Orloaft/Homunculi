<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizbiz - Modular Version</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <script src="phaser.min.js"></script>
    
    <!-- Performance Optimization Systems (from original) -->
    <script src="electron-fixes.js"></script>
    <script src="ChunkManager.js"></script>
    <script src="OptimizedEnemyManager.js"></script>
    <script src="SpatialHashGrid.js"></script>
    <script src="PhysicsOptimizer.js"></script>
    <script src="LODSystem.js"></script>
    <script src="ObstacleManager.js"></script>
    <script src="InfiniteGameScene.js"></script>
    <script src="UltraOptimizedGameScene.js"></script>
    
    <!-- Main Game Module -->
    <script type="module">
        import game from './src/main-modular.js';
        
        // Remove loading text once game starts
        game.events.once('ready', () => {
            const loadingText = document.querySelector('.loading-text');
            if (loadingText) {
                loadingText.remove();
            }
        });
        
        // Handle module loading errors
        window.addEventListener('error', (event) => {
            if (event.error && event.error.message.includes('module')) {
                const container = document.getElementById('game-container');
                container.innerHTML = `
                    <div class="error-message">
                        <h2>Module Loading Error</h2>
                        <p>${event.error.message}</p>
                        <p>Make sure you're running this from a web server (not file://)</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
