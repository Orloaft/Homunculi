<!DOCTYPE html>
<html>
<head>
    <title>Import Test</title>
</head>
<body>
    <h1>Testing Module Imports</h1>
    <div id="results"></div>
    
    <script type="module">
        const results = document.getElementById('results');
        
        async function testImports() {
            try {
                results.innerHTML += '<p>Testing system imports...</p>';
                
                // Test importing from index.js
                const systems = await import('./src/systems/index.js');
                results.innerHTML += '<p style="color: green">✓ Systems index loaded</p>';
                
                // Check specific exports
                const exports = Object.keys(systems);
                results.innerHTML += `<p>Found exports: ${exports.join(', ')}</p>`;
                
                // Test importing GameSceneModular
                const { default: GameSceneModular } = await import('./src/scenes/GameSceneModular.js');
                results.innerHTML += '<p style="color: green">✓ GameSceneModular loaded</p>';
                
            } catch (error) {
                results.innerHTML += `<p style="color: red">✗ Error: ${error.message}</p>`;
                console.error('Import error:', error);
            }
        }
        
        testImports();
    </script>
</body>
</html>
