<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizBiz - Automated Test Runner</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #0f0;
            margin: 0;
            padding: 20px;
        }
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px;
            background: #333;
            border: 1px solid #0f0;
            border-radius: 5px;
        }
        #test-log {
            max-height: 300px;
            overflow-y: auto;
            background: #000;
            border: 1px solid #333;
            padding: 10px;
            margin: 20px 0;
        }
        .error { color: #f00; }
        .warning { color: #ff0; }
        .success { color: #0f0; }
        .info { color: #0ff; }
        #game-container {
            width: 800px;
            height: 600px;
            margin: 20px auto;
            border: 2px solid #333;
        }
        #controls {
            text-align: center;
            margin: 20px;
        }
        button {
            background: #333;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        #metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .metric-card {
            background: #222;
            padding: 10px;
            border: 1px solid #444;
        }
        .metric-value {
            font-size: 24px;
            color: #0ff;
        }
    </style>
</head>
<body>
    <div id="status">
        <div>Status: <span id="test-status">Initializing...</span></div>
        <div>Test Time: <span id="test-time">0s</span></div>
        <div>Errors: <span id="error-count">0</span></div>
    </div>

    <h1>WizBiz Automated Test Runner</h1>
    
    <div id="controls">
        <button onclick="testRunner.startFullTest()">Run Full Test Suite</button>
        <button onclick="testRunner.testSceneTransitions()">Test Scenes</button>
        <button onclick="testRunner.testGameplay()">Test Gameplay</button>
        <button onclick="testRunner.testPerformance()">Test Performance</button>
        <button onclick="testRunner.stopTests()">Stop Tests</button>
        <button onclick="testRunner.exportReport()">Export Report</button>
    </div>

    <div id="metrics">
        <div class="metric-card">
            <div>FPS</div>
            <div class="metric-value" id="fps-value">--</div>
        </div>
        <div class="metric-card">
            <div>Memory (MB)</div>
            <div class="metric-value" id="memory-value">--</div>
        </div>
        <div class="metric-card">
            <div>Entity Count</div>
            <div class="metric-value" id="entity-count">--</div>
        </div>
    </div>

    <div id="test-log"></div>
    <div id="game-container"></div>

    <script src="scripts/phaser.min.js"></script>
    <script src="scripts/hitbox-config.js"></script>
    <script src="scripts/game.js"></script>
    <script src="scripts/automated-test-runner.js"></script>
</body>
</html>
