<!DOCTYPE html>
<html>
<head>
    <title>WizBiz - Gradual Refactor Test</title>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2d2d2d;
        }
        #game-container {
            border: 2px solid #444;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="phaser.min.js"></script>
    <script>
        // Inline DebugManager for browser compatibility
        const debugManager = {
            debugEnabled: localStorage.getItem('debugMode') === 'true',
            isEnabled() { return this.debugEnabled; },
            setEnabled(enabled) { 
                this.debugEnabled = enabled;
                localStorage.setItem('debugMode', enabled.toString());
            },
            toggle() {
                this.debugEnabled = !this.debugEnabled;
                localStorage.setItem('debugMode', this.debugEnabled.toString());
                return this.debugEnabled;
            }
        };
    </script>
    <script src="game.js"></script>
</body>
</html>
