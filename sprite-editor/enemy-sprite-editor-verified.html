<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enemy Sprite Editor - Verified Paths</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="sprite-config-verified.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        #game-container {
            flex: 1;
            background: #000;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
        }
        .controls {
            width: 350px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
        }
        h1 {
            margin: 0 0 20px 0;
            color: #00ff00;
            font-size: 24px;
        }
        h3 {
            color: #00ff00;
            margin: 15px 0 10px 0;
            font-size: 16px;
        }
        select, input, button {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 14px;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #00ff00;
        }
        button {
            background: #003300;
            border-color: #00ff00;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #004400;
        }
        .input-group {
            margin: 10px 0;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #888;
            font-size: 12px;
        }
        .hitbox-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .animation-controls {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .animation-controls button {
            flex: 1;
            padding: 6px;
            font-size: 12px;
        }
        #status {
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            min-height: 60px;
        }
        #export-output {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            color: #0f0;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .category-header {
            background: #003300;
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            font-weight: bold;
            color: #00ff00;
            text-transform: uppercase;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="game-container"></div>
        <div class="controls">
            <h1>🎮 Enemy Sprite Editor</h1>
            
            <div class="input-group">
                <label>Select Enemy Type:</label>
                <select id="enemySelect">
                    <option value="">-- Select Enemy --</option>
                </select>
            </div>

            <div class="input-group">
                <label>Scale:</label>
                <input type="range" id="scaleSlider" min="0.1" max="5" step="0.1" value="1">
                <input type="number" id="scaleInput" min="0.1" max="5" step="0.1" value="1">
            </div>

            <h3>Hitbox Configuration</h3>
            <div class="hitbox-inputs">
                <div class="input-group">
                    <label>Width:</label>
                    <input type="number" id="hitboxWidth" value="32">
                </div>
                <div class="input-group">
                    <label>Height:</label>
                    <input type="number" id="hitboxHeight" value="32">
                </div>
                <div class="input-group">
                    <label>Offset X:</label>
                    <input type="number" id="hitboxOffsetX" value="0">
                </div>
                <div class="input-group">
                    <label>Offset Y:</label>
                    <input type="number" id="hitboxOffsetY" value="0">
                </div>
            </div>

            <h3>Animation Controls</h3>
            <div class="animation-controls">
                <button id="playAnim">▶ Play</button>
                <button id="pauseAnim">⏸ Pause</button>
                <button id="stopAnim">⏹ Stop</button>
            </div>
            
            <div class="input-group">
                <label>Animation:</label>
                <select id="animationSelect">
                    <option value="">-- No animations --</option>
                </select>
            </div>

            <button id="exportConfig">📋 Export Configuration</button>
            
            <div id="status">
                Ready. Select an enemy to begin editing.
            </div>
            
            <div id="export-output" style="display: none;"></div>
        </div>
    </div>

    <script>
        class SpriteEditorScene extends Phaser.Scene {
            constructor() {
                super({ key: 'SpriteEditor' });
                this.currentSprite = null;
                this.hitboxGraphics = null;
                this.currentConfig = null;
                this.loadedTextures = new Set();
                this.failedTextures = new Set();
            }

            preload() {
                // Set base path for loading sprites
                this.load.path = '../';
                
                // Load all sprites from config
                const loadSprite = (config, category, name) => {
                    if (!config.path || this.loadedTextures.has(config.texture)) return;
                    
                    console.log(`Loading ${name}: ${config.texture} from ${config.path}`);
                    
                    this.load.spritesheet(config.texture, config.path, {
                        frameWidth: config.frameWidth,
                        frameHeight: config.frameHeight
                    });
                    this.loadedTextures.add(config.texture);
                    
                    // Load animation textures
                    if (config.animations) {
                        Object.values(config.animations).forEach(anim => {
                            if (anim.texture && anim.path && !this.loadedTextures.has(anim.texture)) {
                                const frameWidth = anim.frameWidth || config.frameWidth;
                                const frameHeight = anim.frameHeight || config.frameHeight;
                                console.log(`Loading animation: ${anim.texture} from ${anim.path}`);
                                this.load.spritesheet(anim.texture, anim.path, {
                                    frameWidth: frameWidth,
                                    frameHeight: frameHeight
                                });
                                this.loadedTextures.add(anim.texture);
                            }
                        });
                    }
                };
                
                // Load sprites from all categories
                Object.entries(SPRITE_CONFIGS).forEach(([category, sprites]) => {
                    Object.entries(sprites).forEach(([name, config]) => {
                        loadSprite(config, category, name);
                    });
                });
                
                // Error handling
                this.load.on('loaderror', (file) => {
                    console.error('Failed to load:', file.key, file.src);
                    this.failedTextures.add(file.key);
                    document.getElementById('status').innerHTML = 
                        `<span style="color: #ff6666;">Failed to load: ${file.key}</span><br>Path: ${file.src}`;
                });
            }

            create() {
                // Create hitbox graphics
                this.hitboxGraphics = this.add.graphics();
                
                // Set up enemy selector
                this.setupEnemySelector();
                
                // Set up controls
                this.setupControls();
                
                // Report loading status
                if (this.failedTextures.size > 0) {
                    console.warn('Failed to load textures:', Array.from(this.failedTextures));
                }
                
                document.getElementById('status').textContent = 
                    `Loaded ${this.loadedTextures.size} sprites successfully. Select an enemy to edit.`;
            }

            setupEnemySelector() {
                const select = document.getElementById('enemySelect');
                select.innerHTML = '<option value="">-- Select Enemy --</option>';
                
                Object.entries(SPRITE_CONFIGS).forEach(([category, sprites]) => {
                    // Add category header
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = category.charAt(0).toUpperCase() + category.slice(1);
                    
                    Object.entries(sprites).forEach(([name, config]) => {
                        // Skip if texture failed to load
                        if (this.failedTextures.has(config.texture)) {
                            return;
                        }
                        
                        const option = document.createElement('option');
                        option.value = `${category}:${name}`;
                        option.textContent = name.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        optgroup.appendChild(option);
                    });
                    
                    if (optgroup.children.length > 0) {
                        select.appendChild(optgroup);
                    }
                });
                
                select.addEventListener('change', () => this.loadEnemy(select.value));
            }

            loadEnemy(selection) {
                if (!selection) return;
                
                const [category, name] = selection.split(':');
                const config = SPRITE_CONFIGS[category][name];
                
                if (!config) {
                    console.error('Config not found for:', selection);
                    return;
                }
                
                // Skip if texture failed to load
                if (this.failedTextures.has(config.texture)) {
                    document.getElementById('status').innerHTML = 
                        `<span style="color: #ff6666;">Cannot load ${name} - sprite file missing</span>`;
                    return;
                }
                
                this.currentConfig = config;
                
                // Clear existing sprite
                if (this.currentSprite) {
                    this.currentSprite.destroy();
                }
                
                try {
                    // Create new sprite
                    this.currentSprite = this.add.sprite(400, 300, config.texture);
                    this.currentSprite.setScale(config.defaultScale || 1);
                    
                    // Create animations
                    this.createAnimations(config);
                    
                    // Update scale controls
                    document.getElementById('scaleSlider').value = config.defaultScale || 1;
                    document.getElementById('scaleInput').value = config.defaultScale || 1;
                    
                    // Update hitbox with defaults
                    document.getElementById('hitboxWidth').value = config.frameWidth || 32;
                    document.getElementById('hitboxHeight').value = config.frameHeight || 32;
                    document.getElementById('hitboxOffsetX').value = 0;
                    document.getElementById('hitboxOffsetY').value = 0;
                    
                    this.updateHitbox();
                    
                    // Update animation selector
                    this.updateAnimationSelector(config);
                    
                    // Play first animation if available
                    const firstAnim = Object.keys(config.animations || {})[0];
                    if (firstAnim) {
                        const animKey = `${config.texture}-${firstAnim}`;
                        if (this.anims.exists(animKey)) {
                            this.currentSprite.play(animKey);
                        }
                    }
                    
                    document.getElementById('status').innerHTML = 
                        `<span style="color: #00ff00;">Loaded: ${name}</span><br>` +
                        `Size: ${config.frameWidth}x${config.frameHeight}`;
                } catch (error) {
                    console.error('Error loading enemy:', error);
                    document.getElementById('status').innerHTML = 
                        `<span style="color: #ff6666;">Error loading ${name}: ${error.message}</span>`;
                }
            }

            createAnimations(config) {
                if (!config.animations) return;
                
                Object.entries(config.animations).forEach(([animName, animConfig]) => {
                    const texture = animConfig.texture || config.texture;
                    const animKey = `${config.texture}-${animName}`;
                    
                    // Skip if texture failed to load
                    if (this.failedTextures.has(texture)) {
                        return;
                    }
                    
                    // Skip if animation already exists
                    if (this.anims.exists(animKey)) {
                        return;
                    }
                    
                    try {
                        // Check if texture exists
                        if (!this.textures.exists(texture)) {
                            console.warn(`Texture ${texture} not loaded for animation ${animName}`);
                            return;
                        }
                        
                        const frameCount = animConfig.frames || 1;
                        const frameRate = animConfig.rate || 10;
                        
                        this.anims.create({
                            key: animKey,
                            frames: this.anims.generateFrameNumbers(texture, {
                                start: 0,
                                end: frameCount - 1
                            }),
                            frameRate: frameRate,
                            repeat: -1
                        });
                        
                        console.log(`Created animation: ${animKey}`);
                    } catch (error) {
                        console.warn(`Could not create animation ${animKey}:`, error);
                    }
                });
            }

            updateAnimationSelector(config) {
                const select = document.getElementById('animationSelect');
                select.innerHTML = '<option value="">-- Select Animation --</option>';
                
                if (!config.animations) return;
                
                Object.keys(config.animations).forEach(animName => {
                    const animKey = `${config.texture}-${animName}`;
                    if (this.anims.exists(animKey)) {
                        const option = document.createElement('option');
                        option.value = animKey;
                        option.textContent = animName.charAt(0).toUpperCase() + animName.slice(1);
                        select.appendChild(option);
                    }
                });
                
                select.addEventListener('change', () => {
                    if (select.value && this.currentSprite) {
                        this.currentSprite.play(select.value);
                    }
                });
            }

            setupControls() {
                // Scale controls
                const scaleSlider = document.getElementById('scaleSlider');
                const scaleInput = document.getElementById('scaleInput');
                
                const updateScale = (value) => {
                    if (this.currentSprite) {
                        this.currentSprite.setScale(value);
                        this.updateHitbox();
                    }
                };
                
                scaleSlider.addEventListener('input', () => {
                    scaleInput.value = scaleSlider.value;
                    updateScale(scaleSlider.value);
                });
                
                scaleInput.addEventListener('change', () => {
                    scaleSlider.value = scaleInput.value;
                    updateScale(scaleInput.value);
                });
                
                // Hitbox controls
                ['hitboxWidth', 'hitboxHeight', 'hitboxOffsetX', 'hitboxOffsetY'].forEach(id => {
                    document.getElementById(id).addEventListener('input', () => this.updateHitbox());
                });
                
                // Animation controls
                document.getElementById('playAnim').addEventListener('click', () => {
                    if (this.currentSprite && this.currentSprite.anims.currentAnim) {
                        this.currentSprite.anims.resume();
                    }
                });
                
                document.getElementById('pauseAnim').addEventListener('click', () => {
                    if (this.currentSprite && this.currentSprite.anims.isPlaying) {
                        this.currentSprite.anims.pause();
                    }
                });
                
                document.getElementById('stopAnim').addEventListener('click', () => {
                    if (this.currentSprite) {
                        this.currentSprite.anims.stop();
                    }
                });
                
                // Export button
                document.getElementById('exportConfig').addEventListener('click', () => this.exportConfig());
            }

            updateHitbox() {
                if (!this.currentSprite) return;
                
                const width = parseInt(document.getElementById('hitboxWidth').value) || 32;
                const height = parseInt(document.getElementById('hitboxHeight').value) || 32;
                const offsetX = parseInt(document.getElementById('hitboxOffsetX').value) || 0;
                const offsetY = parseInt(document.getElementById('hitboxOffsetY').value) || 0;
                const scale = this.currentSprite.scale;
                
                // Clear previous hitbox
                this.hitboxGraphics.clear();
                
                // Draw new hitbox
                this.hitboxGraphics.lineStyle(2, 0x00ff00, 0.8);
                this.hitboxGraphics.strokeRect(
                    this.currentSprite.x - (width * scale / 2) + offsetX,
                    this.currentSprite.y - (height * scale / 2) + offsetY,
                    width * scale,
                    height * scale
                );
                
                // Draw center cross
                this.hitboxGraphics.lineStyle(1, 0xff0000, 0.5);
                this.hitboxGraphics.lineBetween(
                    this.currentSprite.x - 10,
                    this.currentSprite.y,
                    this.currentSprite.x + 10,
                    this.currentSprite.y
                );
                this.hitboxGraphics.lineBetween(
                    this.currentSprite.x,
                    this.currentSprite.y - 10,
                    this.currentSprite.x,
                    this.currentSprite.y + 10
                );
            }

            exportConfig() {
                if (!this.currentSprite || !this.currentConfig) {
                    alert('Please select an enemy first');
                    return;
                }
                
                const enemyName = document.getElementById('enemySelect').value.split(':')[1];
                const config = {
                    name: enemyName,
                    texture: this.currentConfig.texture,
                    scale: parseFloat(document.getElementById('scaleInput').value),
                    hitbox: {
                        width: parseInt(document.getElementById('hitboxWidth').value),
                        height: parseInt(document.getElementById('hitboxHeight').value),
                        offsetX: parseInt(document.getElementById('hitboxOffsetX').value),
                        offsetY: parseInt(document.getElementById('hitboxOffsetY').value)
                    },
                    animations: this.currentConfig.animations
                };
                
                const output = document.getElementById('export-output');
                output.style.display = 'block';
                output.textContent = JSON.stringify(config, null, 2);
                
                // Copy to clipboard
                navigator.clipboard.writeText(JSON.stringify(config, null, 2));
                
                document.getElementById('status').innerHTML = 
                    '<span style="color: #00ff00;">Configuration exported and copied to clipboard!</span>';
            }

            update() {
                // Could add sprite dragging or other interactive features here
            }
        }

        // Initialize Phaser game
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            backgroundColor: '#222',
            scene: SpriteEditorScene
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
