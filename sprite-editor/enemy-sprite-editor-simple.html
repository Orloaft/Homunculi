<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enemy Hitbox Configuration Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #151515 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #00ff88, #00bbff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }
        
        .enemy-list {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
        }
        
        .enemy-item {
            padding: 10px;
            margin: 5px 0;
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .enemy-item:hover {
            background: #3a3a4e;
            transform: translateX(5px);
        }
        
        .enemy-item.active {
            background: linear-gradient(135deg, #00ff88 0%, #00bbff 100%);
            color: #000;
        }
        
        .editor-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
        }
        
        .visual-editor {
            width: 100%;
            height: 400px;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 5px;
            position: relative;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .sprite-preview {
            position: relative;
        }
        
        .sprite-rect {
            width: 64px;
            height: 64px;
            background: #444;
            border: 2px solid #666;
            position: relative;
        }
        
        .hitbox-rect {
            position: absolute;
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.2);
            pointer-events: none;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            flex: 1;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .value-display {
            min-width: 60px;
            text-align: right;
            font-family: monospace;
            color: #00ff88;
        }
        
        .config-output {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00ff88 0%, #00bbff 100%);
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }
        
        button.secondary {
            background: #444;
            color: #fff;
        }
        
        .info-panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 12px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }
        
        .info-label {
            color: #888;
        }
        
        .info-value {
            color: #00ff88;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>🎮 Enemy Hitbox Configuration Tool</h1>
    
    <div class="container">
        <div class="enemy-list">
            <h3>Enemy Types</h3>
            <div id="enemy-list-container"></div>
        </div>
        
        <div class="editor-panel">
            <h3>Visual Editor - <span id="current-enemy">None Selected</span></h3>
            
            <div class="visual-editor">
                <div class="sprite-preview" id="sprite-preview">
                    <div class="sprite-rect" id="sprite-rect">
                        <div class="hitbox-rect" id="hitbox-rect"></div>
                    </div>
                </div>
            </div>
            
            <div class="info-panel">
                <div class="info-row">
                    <span class="info-label">Enemy Type:</span>
                    <span class="info-value" id="enemy-type">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Sprite Size:</span>
                    <span class="info-value" id="sprite-size">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Scale:</span>
                    <span class="info-value" id="scale-info">-</span>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Sprite Scale</label>
                <div class="slider-container">
                    <input type="range" id="scale" min="0.1" max="5" step="0.1" value="1">
                    <span class="value-display" id="scale-value">1.0</span>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Hitbox Width</label>
                <div class="slider-container">
                    <input type="range" id="width" min="5" max="200" value="30">
                    <span class="value-display" id="width-value">30</span>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Hitbox Height</label>
                <div class="slider-container">
                    <input type="range" id="height" min="5" max="200" value="30">
                    <span class="value-display" id="height-value">30</span>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Hitbox Offset X</label>
                <div class="slider-container">
                    <input type="range" id="offsetX" min="-100" max="100" value="0">
                    <span class="value-display" id="offsetX-value">0</span>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Hitbox Offset Y</label>
                <div class="slider-container">
                    <input type="range" id="offsetY" min="-100" max="100" value="0">
                    <span class="value-display" id="offsetY-value">0</span>
                </div>
            </div>
            
            <div class="button-group">
                <button onclick="saveConfig()">Save Configuration</button>
                <button class="secondary" onclick="resetCurrent()">Reset Current</button>
                <button class="secondary" onclick="exportAll()">Export All</button>
                <button class="secondary" onclick="copyToClipboard()">Copy to Clipboard</button>
            </div>
            
            <div class="config-output" id="config-output">
                // Configuration will appear here
            </div>
        </div>
    </div>
    
    <script>
        // Enemy configurations with default sizes
        const enemyTypes = {
            // Forest enemies
            'mushroom': { width: 150, height: 46, defaultScale: 0.7 },
            'tree': { width: 64, height: 64, defaultScale: 1.5 },
            'giantfly': { width: 32, height: 32, defaultScale: 2.0 },
            'squirrel': { width: 32, height: 32, defaultScale: 2.0 },
            'redpanda': { width: 32, height: 32, defaultScale: 2.0 },
            
            // Cave enemies
            'golem': { width: 64, height: 64, defaultScale: 1.5 },
            'slime': { width: 32, height: 32, defaultScale: 1.5 },
            'kobold': { width: 64, height: 64, defaultScale: 1.0 },
            'brainmole': { width: 32, height: 32, defaultScale: 2.0 },
            'intellectdevourer': { width: 32, height: 32, defaultScale: 1.8 },
            
            // Desert enemies
            'bat': { width: 150, height: 150, defaultScale: 0.5 },
            'soul': { width: 64, height: 64, defaultScale: 1.0 },
            'fireworm': { width: 90, height: 90, defaultScale: 1.2 },
            'summoner': { width: 64, height: 64, defaultScale: 0.8 },
            'darkbat': { width: 64, height: 64, defaultScale: 0.8 },
            'flyingdemon': { width: 64, height: 64, defaultScale: 1.0 },
            
            // Special enemies
            'wraith': { width: 64, height: 64, defaultScale: 1.5 },
            'sorcerer': { width: 64, height: 64, defaultScale: 1.2 },
            'axeimp': { width: 64, height: 64, defaultScale: 1.0 },
            'clubimp': { width: 64, height: 64, defaultScale: 1.0 },
            'skeleton': { width: 64, height: 64, defaultScale: 1.0 },
            'yellowskeleton': { width: 64, height: 64, defaultScale: 1.0 },
            'skeletonseeker': { width: 64, height: 64, defaultScale: 1.0 }
        };
        
        let currentEnemy = null;
        let configurations = {};
        
        // Load saved configurations
        function loadConfigurations() {
            const saved = localStorage.getItem('enemyHitboxConfigs');
            if (saved) {
                configurations = JSON.parse(saved);
            }
        }
        
        // Save configurations
        function saveConfigurations() {
            localStorage.setItem('enemyHitboxConfigs', JSON.stringify(configurations));
        }
        
        // Initialize enemy list
        function initEnemyList() {
            const container = document.getElementById('enemy-list-container');
            for (const enemy in enemyTypes) {
                const div = document.createElement('div');
                div.className = 'enemy-item';
                div.textContent = enemy.charAt(0).toUpperCase() + enemy.slice(1);
                div.onclick = () => selectEnemy(enemy);
                div.id = 'enemy-' + enemy;
                container.appendChild(div);
            }
        }
        
        // Select enemy
        function selectEnemy(enemy) {
            currentEnemy = enemy;
            
            // Update UI
            document.querySelectorAll('.enemy-item').forEach(el => el.classList.remove('active'));
            document.getElementById('enemy-' + enemy).classList.add('active');
            document.getElementById('current-enemy').textContent = enemy.charAt(0).toUpperCase() + enemy.slice(1);
            document.getElementById('enemy-type').textContent = enemy;
            
            // Load configuration or defaults
            const config = configurations[enemy] || {
                scale: enemyTypes[enemy].defaultScale,
                hitbox: {
                    width: 30,
                    height: 30,
                    offsetX: 0,
                    offsetY: 0
                }
            };
            
            // Update controls
            document.getElementById('scale').value = config.scale;
            document.getElementById('scale-value').textContent = config.scale.toFixed(1);
            document.getElementById('width').value = config.hitbox.width;
            document.getElementById('width-value').textContent = config.hitbox.width;
            document.getElementById('height').value = config.hitbox.height;
            document.getElementById('height-value').textContent = config.hitbox.height;
            document.getElementById('offsetX').value = config.hitbox.offsetX;
            document.getElementById('offsetX-value').textContent = config.hitbox.offsetX;
            document.getElementById('offsetY').value = config.hitbox.offsetY;
            document.getElementById('offsetY-value').textContent = config.hitbox.offsetY;
            
            // Update info
            const spriteInfo = enemyTypes[enemy];
            document.getElementById('sprite-size').textContent = `${spriteInfo.width}x${spriteInfo.height}`;
            document.getElementById('scale-info').textContent = config.scale.toFixed(1);
            
            updateVisual();
            updateOutput();
        }
        
        // Update visual preview
        function updateVisual() {
            if (!currentEnemy) return;
            
            const scale = parseFloat(document.getElementById('scale').value);
            const width = parseInt(document.getElementById('width').value);
            const height = parseInt(document.getElementById('height').value);
            const offsetX = parseInt(document.getElementById('offsetX').value);
            const offsetY = parseInt(document.getElementById('offsetY').value);
            
            const spriteInfo = enemyTypes[currentEnemy];
            const spriteRect = document.getElementById('sprite-rect');
            const hitboxRect = document.getElementById('hitbox-rect');
            
            // Update sprite size
            const displayWidth = spriteInfo.width * scale;
            const displayHeight = spriteInfo.height * scale;
            spriteRect.style.width = displayWidth + 'px';
            spriteRect.style.height = displayHeight + 'px';
            
            // Update hitbox
            hitboxRect.style.width = width + 'px';
            hitboxRect.style.height = height + 'px';
            hitboxRect.style.left = offsetX + 'px';
            hitboxRect.style.top = offsetY + 'px';
        }
        
        // Update configuration output
        function updateOutput() {
            if (!currentEnemy) return;
            
            const output = document.getElementById('config-output');
            const allConfigs = {
                hitboxes: {},
                scales: {}
            };
            
            // Add current enemy config
            const scale = parseFloat(document.getElementById('scale').value);
            const width = parseInt(document.getElementById('width').value);
            const height = parseInt(document.getElementById('height').value);
            const offsetX = parseInt(document.getElementById('offsetX').value);
            const offsetY = parseInt(document.getElementById('offsetY').value);
            
            allConfigs.hitboxes[currentEnemy] = { width, height, offsetX, offsetY };
            allConfigs.scales[currentEnemy] = scale;
            
            // Add all saved configs
            for (const [enemy, config] of Object.entries(configurations)) {
                allConfigs.hitboxes[enemy] = config.hitbox;
                allConfigs.scales[enemy] = config.scale;
            }
            
            output.textContent = JSON.stringify(allConfigs, null, 2);
        }
        
        // Save current configuration
        function saveConfig() {
            if (!currentEnemy) return;
            
            const scale = parseFloat(document.getElementById('scale').value);
            const width = parseInt(document.getElementById('width').value);
            const height = parseInt(document.getElementById('height').value);
            const offsetX = parseInt(document.getElementById('offsetX').value);
            const offsetY = parseInt(document.getElementById('offsetY').value);
            
            configurations[currentEnemy] = {
                scale: scale,
                hitbox: { width, height, offsetX, offsetY }
            };
            
            saveConfigurations();
            updateOutput();
            alert('Configuration saved for ' + currentEnemy);
        }
        
        // Reset current enemy
        function resetCurrent() {
            if (!currentEnemy) return;
            
            delete configurations[currentEnemy];
            saveConfigurations();
            selectEnemy(currentEnemy);
        }
        
        // Export all configurations
        function exportAll() {
            const allConfigs = {
                hitboxes: {},
                scales: {}
            };
            
            for (const [enemy, config] of Object.entries(configurations)) {
                allConfigs.hitboxes[enemy] = config.hitbox;
                allConfigs.scales[enemy] = config.scale;
            }
            
            document.getElementById('config-output').textContent = JSON.stringify(allConfigs, null, 2);
        }
        
        // Copy to clipboard
        function copyToClipboard() {
            const output = document.getElementById('config-output');
            const text = output.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                alert('Configuration copied to clipboard!');
            });
        }
        
        // Add event listeners to sliders
        document.getElementById('scale').addEventListener('input', (e) => {
            document.getElementById('scale-value').textContent = parseFloat(e.target.value).toFixed(1);
            document.getElementById('scale-info').textContent = parseFloat(e.target.value).toFixed(1);
            updateVisual();
        });
        
        document.getElementById('width').addEventListener('input', (e) => {
            document.getElementById('width-value').textContent = e.target.value;
            updateVisual();
        });
        
        document.getElementById('height').addEventListener('input', (e) => {
            document.getElementById('height-value').textContent = e.target.value;
            updateVisual();
        });
        
        document.getElementById('offsetX').addEventListener('input', (e) => {
            document.getElementById('offsetX-value').textContent = e.target.value;
            updateVisual();
        });
        
        document.getElementById('offsetY').addEventListener('input', (e) => {
            document.getElementById('offsetY-value').textContent = e.target.value;
            updateVisual();
        });
        
        // Initialize
        loadConfigurations();
        initEnemyList();
    </script>
</body>
</html>
